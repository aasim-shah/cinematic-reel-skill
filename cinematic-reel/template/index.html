<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/type/Anton.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "IBM Plex Sans"; src: url("assets/type/IBMPlexSans.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      @font-face { font-family: "Special Elite"; src: url("assets/type/SpecialElite.woff2") format("woff2"); font-weight: 400; font-style: normal; }
      @font-face { font-family: "Kalam"; src: url("assets/fonts/Kalam-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      @font-face { font-family: "Tillana"; src: url("assets/fonts/Tillana-700.woff2") format("woff2"); font-weight: 700; font-style: normal; }
      /* Direction A: cinematic-doc. Ink black, film white, ONE accent: signal red. */
      :root {
        --ink: #050505;
        --film: #efe9df;
        --signal: #e0301e;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* stage + camera: untimed wrappers for layout moves and zooms. Animate these, never the timed <video> clips. */
      #stage { position: absolute; inset: 0; overflow: hidden; }
      #camera { position: absolute; inset: 0; transform-origin: 50% 34%; }
      .take, .take-fg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #fg-4 { clip-path: polygon(330px 0, 1080px 0, 1080px 1920px, 0 1920px, 0 1080px, 330px 1080px); }

      /* room dims under the closing claim; the matte keeps the speaker lit */
      #dim { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 55% at 55% 30%, rgba(8, 10, 12, 0.66) 0%, rgba(4, 5, 6, 0.86) 100%); opacity: 0; }
      #bt { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-family: "Anton", sans-serif; font-size: 452px; line-height: 1; letter-spacing: 0.005em; color: var(--film); white-space: nowrap; opacity: 0; transform-origin: 50% 40%; }
      #bt-rule { position: absolute; left: 0; top: 560px; width: 1080px; height: 7px; background: var(--signal); transform-origin: 0 50%; box-shadow: 0 0 22px rgba(224, 48, 30, 0.55); }
      #bt-tag-sq, #ttl-kick-sq { opacity: 0; }
      #bt-tag { position: absolute; left: 72px; top: 596px; display: flex; align-items: center; gap: 16px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 28px; letter-spacing: 0.22em; color: var(--film); white-space: nowrap; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }

      #scrim-top { position: absolute; left: 0; top: 0; width: 1080px; height: 460px; background: linear-gradient(180deg, rgba(0, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0) 100%); }
      #scrim-bot { position: absolute; left: 0; top: 980px; width: 1080px; height: 940px; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.42) 45%, rgba(0, 0, 0, 0.78) 100%); opacity: 0.6; }

      /* 2.39-style letterbox bars (they also close like a shutter) */
      .bar { position: absolute; left: 0; width: 1080px; height: 960px; background: var(--ink); }
      #bar-top { top: 0; }
      #bar-bot { top: 960px; }

      /* chapter title */
      #ttl { position: absolute; left: 84px; right: 84px; top: 1108px; height: 400px; }
      #ttl-kick { display: flex; align-items: center; gap: 16px; height: 44px; margin-bottom: 14px; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.26em; color: var(--film); white-space: nowrap; }
      .sq { display: block; width: 18px; height: 18px; background: var(--signal); flex: none; }
      .ttl-line { display: flex; gap: 34px; height: 156px; font-family: "Anton", sans-serif; font-size: 150px; line-height: 156px; color: var(--film); white-space: nowrap; text-transform: uppercase; }
      .m { display: block; overflow: hidden; height: 156px; }
      .w { display: block; }
      .kw { position: relative; display: block; }
      #ttl-circle { position: absolute; left: -26px; top: -14px; width: calc(100% + 58px); height: 184px; overflow: visible; }

      /* HUD: case label + running timecode */
      .hud { position: absolute; top: 116px; height: 40px; display: flex; align-items: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 26px; letter-spacing: 0.2em; color: var(--film); white-space: nowrap; }
      #lbl { left: 72px; gap: 18px; }
      #lbl-stack { position: relative; width: 640px; height: 40px; }
      .lbl-t { position: absolute; left: 0; top: 0; line-height: 40px; }
      .lbl-t .dim { opacity: 0.55; }
      #tc { right: 72px; font-size: 24px; letter-spacing: 0.12em; opacity: 0.72; }

      /* documentary subtitles: small, white, no boxes, words light up as spoken */
      #subs { position: absolute; left: 90px; right: 90px; top: 1436px; height: 140px; }
      .sub { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-wrap: wrap; justify-content: center; column-gap: 12px; opacity: 0; }
      .sw { display: block; font-family: "IBM Plex Sans", sans-serif; font-weight: 500; font-size: 46px; line-height: 60px; color: #fff; opacity: 0.4; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 22px rgba(0, 0, 0, 0.45); }

      /* handwritten accents (hard rule: Kalam = pen notes, Tillana = display hand) */
      .hand { position: absolute; font-family: "Kalam", cursive; font-weight: 700; color: var(--film); white-space: nowrap; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55); }
      .hand-svg { position: absolute; overflow: visible; }
      #hn-hook { left: 58px; top: 596px; height: 140px; font-size: 54px; line-height: 64px; transform: rotate(-6deg); }
      #hn-hook-arrow { left: 330px; top: 700px; width: 260px; height: 150px; }
      #hn-ttl { left: 670px; top: 240px; height: 110px; font-family: "Tillana", cursive; font-size: 76px; line-height: 110px; color: var(--signal); text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7); transform: rotate(-7deg); }
      #hn-ttl-arrow { left: 642px; top: 196px; width: 64px; height: 64px; }
      #hn-end { left: 66px; top: 656px; height: 150px; font-family: "Tillana", cursive; font-size: 56px; line-height: 70px; transform: rotate(-4deg); }
      #flash { position: absolute; inset: 0; background: #fff6ea; opacity: 0; }
      #grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background-image: url("assets/tex/grain.png"); background-size: 512px 512px; mix-blend-mode: overlay; opacity: 0.08; }
    </style>
  </head>
