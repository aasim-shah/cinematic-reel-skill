      <script>
        (function () {
          // Board-local time: this clip starts at 6.53 s on the root timeline.
          var T0 = 6.53;
          function L(g) { return g - T0; }

          // Item boxes (world px) mirroring the CSS above; rotation is about each box centre.
          var BOX = {
            clip: { left: 250, top: 360, w: 860, h: 1180, deg: -2.5 },
            card: { left: 700, top: 2250, w: 1000, h: 620, deg: 2 },
            p1: { left: 1270, top: 270, w: 560, h: 690, deg: 4 },
            p2: { left: 1460, top: 1300, w: 540, h: 670, deg: -5 },
            kase: { left: 300, top: 150, w: 820, h: 96, deg: -1.5 },
            chart: { left: 190, top: 1720, w: 620, h: 480, deg: -3 }
          };
          function at(b, lx, ly) {
            var a = b.deg * Math.PI / 180, dx = lx - b.w / 2, dy = ly - b.h / 2;
            return { x: b.left + b.w / 2 + dx * Math.cos(a) - dy * Math.sin(a), y: b.top + b.h / 2 + dx * Math.sin(a) + dy * Math.cos(a) };
          }
          function place(id, p) { var el = document.getElementById(id); el.style.left = p.x.toFixed(1) + "px"; el.style.top = p.y.toFixed(1) + "px"; }

          var PIN_A = at(BOX.clip, 676, 376);
          var PIN_B = at(BOX.card, 500, 34);
          var P_CASE = at(BOX.kase, 46, 48);
          var P_P1 = at(BOX.p1, 280, 24);
          var P_P2 = at(BOX.p2, 270, 24);
          var P_CHART = at(BOX.chart, 310, 26);
          var P_CLIP = at(BOX.clip, 430, 22);
          place("bd-pin-a", PIN_A); place("bd-pin-b", PIN_B); place("bd-pin-case", P_CASE);
          place("bd-pin-p1", P_P1); place("bd-pin-p2", P_P2); place("bd-pin-chart", P_CHART); place("bd-pin-clip", P_CLIP);

          // camera targets (world)
          var HEAD = at(BOX.clip, 430, 300);
          var DECK = at(BOX.clip, 430, 420);
          var NUM = at(BOX.card, 500, 318);

          function sag(a, b, s) {
            var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + s;
            return "M" + a.x.toFixed(1) + " " + a.y.toFixed(1) + " Q" + mx.toFixed(1) + " " + my.toFixed(1) + " " + b.x.toFixed(1) + " " + b.y.toFixed(1);
          }
          document.getElementById("bd-th1").setAttribute("d", sag(P_CASE, P_P1, 90));
          document.getElementById("bd-th2").setAttribute("d", sag(P_P2, P_CHART, 120));

          var dStr = "M" + PIN_A.x.toFixed(1) + " " + PIN_A.y.toFixed(1) +
            " C" + (PIN_A.x + 330).toFixed(1) + " " + (PIN_A.y + 640).toFixed(1) +
            " " + (PIN_B.x + 280).toFixed(1) + " " + (PIN_B.y - 760).toFixed(1) +
            " " + PIN_B.x.toFixed(1) + " " + PIN_B.y.toFixed(1);
          var str = document.getElementById("bd-string");
          var strSh = document.getElementById("bd-string-sh");
          str.setAttribute("d", dStr);
          strSh.setAttribute("d", dStr);
          strSh.setAttribute("transform", "translate(7 11)");
          var LEN = str.getTotalLength();
          var N = 120, PTS = [];
          for (var i = 0; i <= N; i++) { var q = str.getPointAtLength(LEN * i / N); PTS.push({ x: q.x, y: q.y }); }
          function tip(p) {
            var f = Math.max(0, Math.min(1, p)) * N, i0 = Math.floor(f), i1 = Math.min(N, i0 + 1), k = f - i0;
            return { x: PTS[i0].x + (PTS[i1].x - PTS[i0].x) * k, y: PTS[i0].y + (PTS[i1].y - PTS[i0].y) * k };
          }
          [str, strSh].forEach(function (el) { el.style.strokeDasharray = LEN.toFixed(1) + " " + (LEN + 10).toFixed(1); el.style.strokeDashoffset = LEN.toFixed(1); });

          // typed line on the card
          var pred = document.getElementById("bd-pred");
          var PRED = "PREDICTION —";
          PRED.split("").forEach(function (ch, i) {
            var s = document.createElement("span");
            s.id = "bd-pc" + i; s.className = "bd-pc"; s.textContent = ch; s.style.opacity = "0";
            pred.appendChild(s);
          });

          // hand-drawn marks
          function prepDraw(id) {
            var p = document.getElementById(id), l = p.getTotalLength();
            p.style.strokeDasharray = l.toFixed(1) + " " + (l + 10).toFixed(1);
            p.style.strokeDashoffset = l.toFixed(1);
            return l;
          }
          var IVL = prepDraw("bd-ivbox-p");
          var NCL = prepDraw("bd-num-circle-p");

          var tl = gsap.timeline({ paused: true });
          function pan(c) { return { x: -c.x, y: -c.y }; }

          // ---- camera: establishing drift while the shutter reopens ----
          var C0 = { x: 1080, y: 1260 }, C1 = { x: 930, y: 1060 };
          tl.fromTo("#bd-pan", pan(C0), Object.assign(pan(C1), { duration: L(7.42) - L(6.53), ease: "sine.inOut", immediateRender: true }), 0);
          tl.fromTo("#bd-zoom", { scale: 0.56, rotation: -2.2 }, { scale: 0.68, rotation: -1.2, duration: L(7.42), ease: "sine.inOut", immediateRender: true }, 0);

          // ---- push into the headline (lands on "Elon") ----
          tl.fromTo("#bd-pan", pan(C1), Object.assign(pan(HEAD), { duration: 0.5, ease: "power3.inOut", immediateRender: false }), L(7.42));
          tl.fromTo("#bd-zoom", { scale: 0.68, rotation: -1.2 }, { scale: 1.3, rotation: -0.4, duration: 0.5, ease: "power3.inOut", immediateRender: false }, L(7.42));
          tl.fromTo("#bd-zoom", { scale: 1.3 }, { scale: 1.37, duration: 0.5, ease: "sine.out", immediateRender: false }, L(7.92));
          // photo "develops" with the flash
          tl.fromTo("#bd-photo svg", { opacity: 0.15 }, { opacity: 1, duration: 0.35, ease: "power2.out", immediateRender: true }, L(7.9));
          // date stamp hits
          tl.fromTo("#bd-stamp", { opacity: 0, scale: 1.35 }, { opacity: 0.92, scale: 1, duration: 0.12, ease: "power2.in", immediateRender: true }, L(8.2));

          // ---- tilt down to the deck, box "INTERVIEW" ----
          tl.fromTo("#bd-pan", pan(HEAD), Object.assign(pan(DECK), { duration: 0.4, ease: "power2.inOut", immediateRender: false }), L(8.44));
          tl.fromTo("#bd-zoom", { scale: 1.37 }, { scale: 1.28, duration: 0.4, ease: "power2.inOut", immediateRender: false }, L(8.44));
          tl.fromTo("#bd-ivbox-p", { strokeDashoffset: IVL }, { strokeDashoffset: 0, duration: 0.32, ease: "power2.out", immediateRender: false }, L(8.62));
          tl.fromTo("#bd-pin-a", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power2.in", immediateRender: true }, L(8.88));

          // ---- red string draws INTERVIEW -> 2029, camera rides the tip ----
          var proxy = { p: 0 };
          var OFF = { x: DECK.x - PIN_A.x, y: DECK.y - PIN_A.y };
          var END = { x: PIN_B.x, y: PIN_B.y + 140 };
          tl.fromTo(proxy, { p: 0 }, {
            p: 1, duration: 1.25, ease: "power2.inOut", immediateRender: false,
            onUpdate: function () {
              var p = proxy.p, t = tip(p), off = 1 - p;
              var o = LEN * (1 - p);
              str.style.strokeDashoffset = o.toFixed(1);
              strSh.style.strokeDashoffset = o.toFixed(1);
              gsap.set("#bd-pan", { x: -(t.x + OFF.x * off + (END.x - PIN_B.x) * p), y: -(t.y + OFF.y * off + (END.y - PIN_B.y) * p) });
            }
          }, L(9.0));
          tl.fromTo("#bd-zoom", { scale: 1.28 }, { scale: 0.74, duration: 0.62, ease: "power2.inOut", immediateRender: false }, L(9.0));
          tl.fromTo("#bd-zoom", { scale: 0.74 }, { scale: 1.08, duration: 0.63, ease: "power2.inOut", immediateRender: false }, L(9.62));
          tl.fromTo("#bd-zoom", { rotation: -0.4 }, { rotation: 1.1, duration: 1.25, ease: "sine.inOut", immediateRender: false }, L(9.0));

          // ---- the 2029 card ----
          PRED.split("").forEach(function (ch, i) { tl.set("#bd-pc" + i, { opacity: 1 }, L(10.02) + i * 0.03); });
          tl.fromTo("#bd-pan", pan(END), Object.assign(pan(NUM), { duration: 0.65, ease: "sine.inOut", immediateRender: false }), L(10.25));
          tl.fromTo("#bd-zoom", { scale: 1.08, rotation: 1.1 }, { scale: 1.2, rotation: 0.7, duration: 0.65, ease: "sine.inOut", immediateRender: false }, L(10.25));
          tl.fromTo("#bd-num-circle-p", { strokeDashoffset: NCL }, { strokeDashoffset: 0, duration: 0.36, ease: "power2.out", immediateRender: false }, L(10.46));

          // handwritten note on the card, written on after the circle
          tl.fromTo("#bd-card-note", { clipPath: "inset(-20% 100% -20% -4%)" }, { clipPath: "inset(-20% -4% -20% -4%)", duration: 0.34, ease: "sine.inOut", immediateRender: true }, L(10.56));

          // ---- crash push into "2029" (flash in the root covers the cut) ----
          tl.fromTo("#bd-zoom", { scale: 1.2, rotation: 0.7 }, { scale: 5.2, rotation: 0, duration: 0.63, ease: "power3.in", immediateRender: false }, L(10.9));

          window.__timelines["board"] = tl;
        })();
      </script>
    </template>
  </body>
