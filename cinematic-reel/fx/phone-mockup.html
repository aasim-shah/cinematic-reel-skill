        a new post lands in the grid and the follower count ticks up.
        Layers (bottom → top): plate → side dim → PHONE → matte cut-out (.ph-fg).
        The phone sits BEHIND the matte, so the head and hands overlap its edge and it never covers the face.

      <script>
        (function () {
          /* ================= CONFIG: everything a reuse needs to change ================= */
          var CONFIG = {
            duration: 3.28,                                  // slot length (s)
            handle: "@aapka.brand",                          // profile handle (generic, never a real account)
            name: "Personal Brand",                          // profile header (Anton)
            bio: "creator · AI + skills · daily",            // one-line bio
            button: "+ NEW POST",                            // red action button
            stats: [                                          // [label, value before press, value after press]
              { label: "POSTS", from: 47, to: 48 },
              { label: "FOLLOWERS", from: 12480, to: 12936 },
              { label: "VIEWS", text: "1.2M" }               // static stat (text only)
            ],
            postImgs: ["post-01", "post-02", "post-03", "post-04", "post-05", "post-06", "post-07"], // assets/fx/phone-mockup/<name>.jpg
            newPostImg: "post-07",                           // fills the "+" slot on the press
            imgDir: "assets/fx/phone-mockup/",
            enterAt: 0.0,  enterDur: 0.8,                    // phone glides in from the left edge
            underlineAt: 1.03,                               // "personal": red underline under the name
            pressAt: 1.89,                                   // "start": the button presses
            countDur: 0.9,                                   // follower tick-up length after the press
            tilt: { rotY: 16, rot: -4 },                     // resting 3D tilt (rotY > 0 turns the screen toward the speaker)
            floatAmp: 9,                                     // px of slow vertical float
            scale: 0.95                                      // phone size (1 = 400×820 px)
          };
          /* ============================================================================ */

          var tl = gsap.timeline({ paused: true });
          function $(id) { return document.getElementById(id); }
          function fmt(n) { return Math.round(n).toLocaleString("en-US"); }

          $("ph-handle").textContent = CONFIG.handle;
          $("ph-name").textContent = CONFIG.name;
          $("ph-bio").textContent = CONFIG.bio;
          $("ph-btn").textContent = CONFIG.button;
          CONFIG.stats.forEach(function (s, i) {
            $("ph-l" + i).textContent = s.label;
            $("ph-n" + i).textContent = s.text || fmt(s.from);
          });
          var grid = $("ph-grid");
          CONFIG.postImgs.slice(0, 7).forEach(function (n) {
            if (n === CONFIG.newPostImg) return;
            var d = document.createElement("div"); d.className = "ph-post";
            var im = document.createElement("img"); im.src = CONFIG.imgDir + n + ".jpg"; im.alt = "";
            d.appendChild(im); grid.appendChild(d);
          });
          $("ph-new-img").src = CONFIG.imgDir + CONFIG.newPostImg + ".jpg";

          // entrance: glide in from the left with the tilt settling, plus side dim
          tl.fromTo("#ph-pos", { x: -520, scale: CONFIG.scale, transformOrigin: "0% 0%" }, { x: 0, scale: CONFIG.scale, duration: CONFIG.enterDur, ease: "power3.out" }, CONFIG.enterAt);
          tl.fromTo("#ph-tilt", { rotationY: CONFIG.tilt.rotY + 22, rotation: CONFIG.tilt.rot - 6, transformPerspective: 1600 },
            { rotationY: CONFIG.tilt.rotY, rotation: CONFIG.tilt.rot, transformPerspective: 1600, duration: CONFIG.enterDur + 0.3, ease: "power3.out" }, CONFIG.enterAt);
          tl.fromTo("#ph-dim", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.inOut" }, CONFIG.enterAt);
          // slow float (one finite yoyo, seek-safe)
          tl.fromTo("#ph-body", { y: 0 }, { y: -CONFIG.floatAmp, duration: CONFIG.duration / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

          // "personal": red underline draws under the name
          tl.fromTo("#ph-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, CONFIG.underlineAt);

          // "start": press → ripple → new post lands → counts tick up
          var P = CONFIG.pressAt;
          tl.fromTo("#ph-btn", { scale: 1, filter: "brightness(1)" }, { scale: 0.94, filter: "brightness(1.18)", duration: 0.09, ease: "power2.out" }, P);
