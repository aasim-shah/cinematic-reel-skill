      <!--
        FX: PULL-BACK REVEAL (full-screen b-roll, no footage, hides the face completely)
        Starts macro-tight on one detail (a red "AI" rubber stamp on paper fibres), holds, then one long
        decelerating pull-back reveals the memo it is stamped on, then the whole evidence board.
        Reuse: copy this file, change the slot id/prefix if needed, edit CONFIG (copy + cue times).
        The camera is a world-space rig like board.html: #pb-pan (x/y) inside #pb-zoom (scale/rotation).
      -->

      <script>
        (function () {
          // =====================================================================
          // CONFIG: everything a reuse needs to change. Times are LOCAL (0 = slot start).
          // =====================================================================
          var CONFIG = {
            duration: 3.88,                 // slot length (s); must match the host data-duration
            // --- copy ---
            stampTop: "CLASSIFIED",         // small line on the rubber stamp
            stampWord: "AI",                // the macro detail: big stamped word (1-3 chars read best)
            memoKind: "INTERNAL MEMO",      // memo header left
            memoNo: "NO. 05",               // memo header right
            memoTo: "TO:  EVERYONE",        // typed line 1
            memoRe: "RE:  THE NEXT 3 YEARS",// typed line 2
            bigLine1: "AI WILL DO",         // giant Anton line 1 (keep <= ~11 chars, no wrapping)
            bigLine2: "ALL THE WORK",       // giant Anton line 2 (gets the red underline)
            note: "3 saal mein?",           // red Tillana reaction note on the memo
            caseStrip: "CASE FILE 05 — WHO DOES THE WORK?",
            mast: "THE WORLD LEDGER",       // fictional masthead only (no real publications)
            headline: "MACHINES AT WORK",
            polLabel: "exhibit 05 · office",
            cardTitle: "TIMELINE —",
            cardNum: "3 YEARS",
            cardFoot: "saara kaam?",
            chartTitle: "TASKS AUTOMATED %",
            // --- camera (world px of the 2400x3600 board; scale = zoom) ---
            macroScale: [3.35, 3.1],        // macro hold: start -> end scale (slow creep back)
            macroRot: [2.4, 2.0],           // macro hold rotation (deg)
            wideScale: 0.56,                // final wide scale (whole board in frame)
            wideRot: -0.6,                  // final rotation (deg)
            wideCenter: { x: 1130, y: 1880 }, // world point at frame centre in the wide shot
            settleScale: 0.575,             // slow drift after landing
            // --- cues (local s) ---
            rackFocus: [0, 0.55],           // blur 7px -> 0 (rack into the macro detail)
            pullAt: 1.2,                    // pull-back starts (just before the spoken "AI" at 1.40)
            pullDur: 2.2,                   // pull-back length; power3.out deceleration
            pullEase: "power3.out",
            underlineAt: 2.25,              // red underline under bigLine2 ("kaam" 1.98 / "karegi" 2.20)
            noteAt: 2.45                    // Tillana note writes on
          };

          function txt(id, s) { document.getElementById(id).textContent = s; }
          txt("pb-stamp-s1", CONFIG.stampTop); txt("pb-stamp-s2", CONFIG.stampWord);
          txt("pb-memo-kind", CONFIG.memoKind); txt("pb-memo-no", CONFIG.memoNo);
          txt("pb-memo-to", CONFIG.memoTo); txt("pb-memo-re", CONFIG.memoRe);
          txt("pb-big1", CONFIG.bigLine1); txt("pb-big2", CONFIG.bigLine2);
          txt("pb-note", CONFIG.note); txt("pb-case", CONFIG.caseStrip);
          txt("pb-mast", CONFIG.mast); txt("pb-head", CONFIG.headline);
          txt("pb-pol-label", CONFIG.polLabel); txt("pb-card-t", CONFIG.cardTitle);
          txt("pb-card-num", CONFIG.cardNum); txt("pb-card-foot", CONFIG.cardFoot);
          txt("pb-chart-t", CONFIG.chartTitle);

          // Item boxes (world px) mirroring the CSS; rotation about each box centre.
          var BOX = {
            memo: { left: 600, top: 1420, w: 1200, h: 1180, deg: -1.2 },
            clip: { left: 260, top: 660, w: 900, h: 900, deg: -3 },
            pol: { left: 1330, top: 720, w: 540, h: 664, deg: 4 },
            kase: { left: 640, top: 520, w: 1120, h: 96, deg: -1.2 },
            card: { left: 220, top: 2990, w: 860, h: 520, deg: 2.5 },
            chart: { left: 1320, top: 2900, w: 700, h: 520, deg: -3 }
          };
          function at(b, lx, ly) {
            var a = b.deg * Math.PI / 180, dx = lx - b.w / 2, dy = ly - b.h / 2;
            return { x: b.left + b.w / 2 + dx * Math.cos(a) - dy * Math.sin(a), y: b.top + b.h / 2 + dx * Math.sin(a) + dy * Math.cos(a) };
          }
          function place(id, p) { var el = document.getElementById(id); el.style.left = p.x.toFixed(1) + "px"; el.style.top = p.y.toFixed(1) + "px"; }

          var P_MEMO = at(BOX.memo, 60, 1130), P_CARD = at(BOX.card, 430, 30);
          var P_CASE = at(BOX.kase, 46, 48), P_CLIP = at(BOX.clip, 450, 22);
          var P_POL = at(BOX.pol, 270, 22), P_CHART = at(BOX.chart, 350, 26);
          place("pb-pin-memo", P_MEMO); place("pb-pin-card", P_CARD); place("pb-pin-case", P_CASE);
          place("pb-pin-clip", P_CLIP); place("pb-pin-pol", P_POL); place("pb-pin-chart", P_CHART);

          function sag(a, b, s) {
            var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + s;
            return "M" + a.x.toFixed(1) + " " + a.y.toFixed(1) + " Q" + mx.toFixed(1) + " " + my.toFixed(1) + " " + b.x.toFixed(1) + " " + b.y.toFixed(1);
          }
          document.getElementById("pb-th1").setAttribute("d", sag(P_CLIP, P_POL, 110));
          document.getElementById("pb-th2").setAttribute("d", sag(P_CASE, P_POL, 70));
          // red string: from the memo's bottom-left corner pin, sagging down to the timeline card
          // (kept off the memo face so the macro shot on the stamp stays clean)
          var dStr = sag(P_MEMO, P_CARD, 160);
          document.getElementById("pb-string").setAttribute("d", dStr);
          document.getElementById("pb-string-sh").setAttribute("d", dStr);

          // macro target = centre of the stamped word (memo-local coords of #pb-stamp-rot + its size)
          // (fixed size estimate: layout is not reliable before fonts load; ~320x244 for "AI")
          var sw = 320, sh = 244;
          var START = at(BOX.memo, 640 + sw / 2, 760 + sh * 0.62);
          var END = CONFIG.wideCenter;

          // ---------------------------------------------------------------------
          // Camera: one seek-safe driver. cam.t is local time; applyCam() derives the whole
          // camera from it (macro creep -> log-space pull-back -> slow settle drift).
          // ---------------------------------------------------------------------
          var pullEase = gsap.parseEase(CONFIG.pullEase);
          var macroEase = gsap.parseEase("sine.inOut");
          var settleEase = gsap.parseEase("sine.out");
          var lnA = Math.log(CONFIG.macroScale[1]), lnB = Math.log(CONFIG.wideScale);
          function lerp(a, b, k) { return a + (b - a) * k; }
          var cam = { t: 0 };
          function applyCam() {
            var t = cam.t, s, r, c;
            var pEnd = CONFIG.pullAt + CONFIG.pullDur;
            if (t < CONFIG.pullAt) {
              var k = macroEase(t / CONFIG.pullAt);
              s = lerp(CONFIG.macroScale[0], CONFIG.macroScale[1], k);
              r = lerp(CONFIG.macroRot[0], CONFIG.macroRot[1], k);
              c = START;
            } else if (t < pEnd) {
              var p = pullEase((t - CONFIG.pullAt) / CONFIG.pullDur);
              s = Math.exp(lerp(lnA, lnB, p));      // log-space zoom reads as an even pull
              r = lerp(CONFIG.macroRot[1], CONFIG.wideRot, p);
              c = { x: lerp(START.x, END.x, p), y: lerp(START.y, END.y, p) };
            } else {
              var q = settleEase(Math.min(1, (t - pEnd) / Math.max(0.01, CONFIG.duration - pEnd)));
              s = lerp(CONFIG.wideScale, CONFIG.settleScale, q);
              r = CONFIG.wideRot; c = END;
            }
            gsap.set("#pb-zoom", { scale: s, rotation: r });
            gsap.set("#pb-pan", { x: -c.x, y: -c.y });
          }

          var tl = gsap.timeline({ paused: true });
          tl.fromTo(cam, { t: 0 }, { t: CONFIG.duration, duration: CONFIG.duration, ease: "none", immediateRender: true, onUpdate: applyCam }, 0);
          applyCam();

          // rack focus into the macro detail
          tl.fromTo("#pb-view", { filter: "blur(7px)" }, { filter: "blur(0px)", duration: CONFIG.rackFocus[1] - CONFIG.rackFocus[0], ease: "power2.out", immediateRender: true }, CONFIG.rackFocus[0]);
          // the tight macro vignette opens as the lens pulls back
          tl.fromTo("#pb-macro", { opacity: 1 }, { opacity: 0, duration: 1.1, ease: "sine.inOut", immediateRender: true }, CONFIG.pullAt);

          // red underline under line 2 (stroke draw)
          var ul = document.getElementById("pb-uline-p"), ulL = ul.getTotalLength();
          ul.style.strokeDasharray = ulL.toFixed(1) + " " + (ulL + 10).toFixed(1);
          tl.fromTo(ul, { strokeDashoffset: ulL + 6 }, { strokeDashoffset: 0, duration: 0.34, ease: "power2.out", immediateRender: true }, CONFIG.underlineAt);

          // hand note written on left to right
          tl.fromTo("#pb-note", { clipPath: "inset(-20% 100% -20% -4%)" }, { clipPath: "inset(-20% -4% -20% -4%)", duration: 0.45, ease: "sine.inOut", immediateRender: true }, CONFIG.noteAt);

          window.__timelines["fx-pullback"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
